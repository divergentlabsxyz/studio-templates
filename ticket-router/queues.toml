# The queues a ticket is routed to, and the Banking77 intents each one takes.
# Every intent is in exactly one queue; train.py refuses this file otherwise.
# Change the queues to your own: the intents stay, the grouping is yours.

[cards]
title = "Cards"
intents = [
  "activate_my_card", "apple_pay_or_google_pay", "card_about_to_expire", "card_acceptance",
  "card_arrival", "card_delivery_estimate", "card_linking", "card_not_working", "change_pin",
  "contactless_not_working", "declined_card_payment", "disposable_card_limits",
  "get_disposable_virtual_card", "get_physical_card", "getting_spare_card",
  "getting_virtual_card", "order_physical_card", "pending_card_payment", "pin_blocked",
  "reverted_card_payment?", "supported_cards_and_currencies", "virtual_card_not_working",
  "visa_or_mastercard",
]

[fraud]
title = "Fraud and security"
intents = [
  "card_payment_not_recognised", "cash_withdrawal_not_recognised", "compromised_card",
  "direct_debit_payment_not_recognised", "lost_or_stolen_card", "lost_or_stolen_phone",
]

[transfers]
title = "Transfers"
intents = [
  "balance_not_updated_after_bank_transfer", "beneficiary_not_allowed", "cancel_transfer",
  "declined_transfer", "failed_transfer", "pending_transfer", "receiving_money",
  "transfer_into_account", "transfer_not_received_by_recipient", "transfer_timing",
]

[top_ups]
title = "Top-ups"
intents = [
  "automatic_top_up", "balance_not_updated_after_cheque_or_cash_deposit", "pending_top_up",
  "top_up_by_cash_or_cheque", "top_up_failed", "top_up_limits", "top_up_reverted",
  "topping_up_by_card", "verify_top_up",
]

[cash]
title = "Cash and ATMs"
intents = [
  "atm_support", "card_swallowed", "declined_cash_withdrawal", "pending_cash_withdrawal",
  "wrong_amount_of_cash_received",
]

[fees]
title = "Fees, rates and refunds"
intents = [
  "Refund_not_showing_up", "card_payment_fee_charged", "card_payment_wrong_exchange_rate",
  "cash_withdrawal_charge", "exchange_charge", "exchange_rate", "exchange_via_app",
  "extra_charge_on_statement", "fiat_currency_support", "request_refund",
  "top_up_by_bank_transfer_charge", "top_up_by_card_charge", "transaction_charged_twice",
  "transfer_fee_charged", "wrong_exchange_rate_for_cash_withdrawal",
]

[account]
title = "Account and identity"
intents = [
  "age_limit", "country_support", "edit_personal_details", "passcode_forgotten",
  "terminate_account", "unable_to_verify_identity", "verify_my_identity",
  "verify_source_of_funds", "why_verify_identity",
]
